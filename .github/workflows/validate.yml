name: validate

on:
  push:
    branches: [master]
  pull_request:

# No `paths:` filter on purpose: a filtered job is reported as "expected" and never
# runs on PRs that don't touch its paths, which blocks a merge if it is ever made a
# required check. The job is a few seconds long, so run it every time.

jobs:
  frontmatter:
    name: skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Validate every skills/*/SKILL.md
        run: python3 scripts/validate-skills.py
